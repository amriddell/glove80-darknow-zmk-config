name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Firmware source with per-layer / per-key RGB (zmk,underglow-layer).
      # Pinned to a commit known to build with the MoErgo config template.
      - uses: actions/checkout@v4
        with:
          repository: darknao/zmk
          ref: 8aeaaa66fbb4b94948c8763e06f1920ab0b69480
          path: src

      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-22.05

      - uses: cachix/cachix-action@v14
        with:
          name: moergo-glove80-zmk-dev
          skipPush: true

      - name: Build Glove80 combined firmware
        run: nix-build config -o combined

      - name: Copy result out of nix store
        run: cp combined/glove80.uf2 glove80.uf2

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: glove80.uf2
          path: glove80.uf2
